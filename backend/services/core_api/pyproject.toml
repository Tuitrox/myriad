[tool.poetry]
name = "core-api"
version = "0.1.0"
description = "API для умных заметок"
authors = ["Tuitrox"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
sqlalchemy = "^2.0.25"
asyncpg = "^0.29.0"
alembic = "^1.13.1"
pydantic-settings = "^2.1.0"
aio-pika = "^9.4.0"
redis = "^5.0.1"
python-multipart = "^0.0.9"
celery = "^5.6.0"
pydantic = {extras = ["email"], version = "^2.12.5"}
bcrypt = "^5.0.0"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
httpx = "^0.28.1"

[tool.poetry.group.dev.dependencies]
black = "^24.1.1"
ruff = "^0.1.14"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"